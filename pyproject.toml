[project]
name = "job-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "deepagents>=0.6.4",
    "docker>=7.1.0",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.1.0",
    "langgraph-cli[inmem]>=0.4.26",
    "lxml>=6.1.1",
    "playwright>=1.60.0",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
codex-oauth-login = "src.codex_oauth.login:main"
job-finder-run = "src.task_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
