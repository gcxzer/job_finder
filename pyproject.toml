[project]
name = "job-finder"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.4",
    "httpx>=0.28.1",
    "langchain-core>=1.4.0",
    "langgraph-cli[inmem]>=0.4.26",
]

[project.scripts]
codex-oauth-login = "codex_oauth.login:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_oauth"]
